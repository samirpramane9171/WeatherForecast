name: Deploy Azure App Service

on:
  workflow_call:
    inputs:
      web_app_name:
        required: true
        type: string
      resource_group:
        required: true
        type: string

jobs:
  deploy_app_service:
    runs-on: ubuntu-latest

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: weatherforecast-api
        path: api-package

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure App Service (Linux)
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ inputs.web_app_name }}
        package: api-package
